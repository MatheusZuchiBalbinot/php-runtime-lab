# What each runtime is, and which Compose service answers HTTP for it.
#
#   <runtime>=<compose service>|<language>|<framework>|<execution model>
#
# Single source of truth for the orchestration scripts (run.sh, run.ps1,
# sweep.sh) and for how results are filed, so adding a runtime means adding one
# line here instead of editing a lookup table in every script.
#
# The last three fields are the axes the comparison is actually about. A result
# directory built from them can be read without knowing the runtime names:
# `php/laravel/octane-swoole` says what it is, while a flat pile of
# `sweep-laravel-octane-swoole-*.json` says only that someone ran something.
#
# Execution model is the axis that explains the numbers:
#   process-per-request   a fresh process boots, serves one request, dies
#   embedded-per-request  the server embeds PHP but still boots per request
#   persistent-worker     the app boots once and stays resident between requests
#   coroutine-worker      persistent, and additionally yields the worker on I/O
#
# Host ports are deliberately absent — the scripts ask Docker for the port it
# actually published rather than re-deriving it from .env.
fpm=nginx|php|vanilla|process-per-request
swoole=app-swoole|php|vanilla|coroutine-worker
roadrunner=app-roadrunner|php|vanilla|persistent-worker

# The same handlers behind a real Laravel application.
#
# Octane on Swoole is classified as a persistent worker, not a coroutine
# worker, even though it runs on Swoole. Octane sets 'enable_coroutine' => false
# in its own default server options, because Laravel's container and facades
# hold per-request state that concurrent coroutines inside one worker would
# corrupt. Requests are therefore serialised per worker exactly as with
# RoadRunner. Measured rather than assumed: on the 10 ms blocking route it
# drained 345 rps — the workers-over-latency ceiling — against 5,468 rps for
# vanilla Swoole running the same handler with the hooks enabled. Forcing the
# flag on would not make it faster, it would make it wrong.
laravel-fpm=nginx-laravel|php|laravel|process-per-request
laravel-octane-swoole=app-laravel-octane-swoole|php|laravel|persistent-worker
laravel-octane-roadrunner=app-laravel-octane-roadrunner|php|laravel|persistent-worker

# FrankenPHP — Caddy and PHP in one binary. Both modes run the SAME image and
# differ only in the mounted Caddyfile, which isolates "persistent worker" as a
# variable without changing the server underneath it at the same time.
frankenphp=app-frankenphp|php|vanilla|embedded-per-request
frankenphp-worker=app-frankenphp-worker|php|vanilla|persistent-worker
