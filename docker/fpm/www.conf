[www]
user = www-data
group = www-data

listen = 9000

; Fixed-size pool (pm = static) rather than dynamic scaling. A benchmark run
; should not have FPM spawning and reaping children in the middle of the
; measurement — that adds variance that has nothing to do with the runtime
; being measured. A fixed pool is also what makes this knob directly
; comparable to SWOOLE_WORKERS and RR_WORKERS, which are fixed worker counts.
pm = static

; Placeholder only: docker/fpm/entrypoint.sh rewrites this line at container
; startup from APP_WORKERS, the shared worker budget every runtime in the lab
; runs with. Change APP_CPUS in .env, not this number.
pm.max_children = 16

; Also rewritten at startup, from APP_MAX_REQUESTS. Worker recycling is
; equalised across every runtime because recycling costs a full bootstrap, and
; an uneven policy would credit that cost to the execution model.
pm.max_requests = 500

clear_env = no
