; JIT tuning profile. Selected with PHP_TUNING=jit.
;
; The JIT compiles hot paths to machine code. The expectation this profile
; exists to test is that it helps the CPU-bound route measurably and does
; close to nothing for the I/O-bound one, since that route spends its time
; waiting rather than executing PHP.
;
; "tracing" is the general-purpose mode (function-level tracing of hot loops);
; the buffer has to be non-zero or the JIT stays off no matter what jit= says.
opcache.jit=tracing
opcache.jit_buffer_size=64M
