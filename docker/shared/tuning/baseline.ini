; Baseline tuning profile: OPcache on, JIT off, no preload.
;
; The profile every measurement runs under unless told otherwise, and the
; reference the other profiles are compared against. Selected with
; PHP_TUNING=baseline (the default).
;
; Nothing is set here on purpose: docker/shared/php.ini already establishes
; the baseline, and this file exists so that "no extra tuning" is an explicit
; choice in the results rather than the absence of a file.
