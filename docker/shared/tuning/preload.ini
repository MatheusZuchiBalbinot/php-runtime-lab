; OPcache preload profile. Selected with PHP_TUNING=preload.
;
; Preloading compiles the application's classes once at server startup and
; keeps them permanently in memory, so no request pays to link them.
;
; The interesting part is that this should favour PHP-FPM far more than the
; worker runtimes: FPM re-bootstraps per request, which is exactly the cost
; preloading removes, while a Swoole or RoadRunner worker already keeps the
; classes loaded between requests and has little left to gain.
opcache.preload=/var/www/html/preload.php
opcache.preload_user=root
