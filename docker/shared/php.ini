; Shared PHP configuration, applied identically to every runtime in the lab.
; Keeping a single file is what makes the benchmark apples-to-apples: any
; tuning added here lands on all of them at once, so no runtime can win simply
; by being better configured.

; OPcache has to be enabled for BOTH SAPIs. PHP-FPM runs under the "fpm"
; SAPI, where opcache.enable is what counts; Swoole and RoadRunner run
; their PHP workers under the "cli" SAPI, where opcache.enable is ignored
; and opcache.enable_cli is the switch that matters. Setting only the
; former silently leaves OPcache inactive on the worker-based runtimes.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=64
opcache.max_accelerated_files=10000

; Application code is baked into the image and never changes at runtime,
; so there is no reason to pay for the stat() calls that check file mtimes.
opcache.validate_timestamps=0

; JIT stays off by default so every runtime is measured on the same terms.
; Turning it on is an explicit experiment, not a hidden default — the profiles
; that do so live in docker/shared/tuning/.
opcache.jit_buffer_size=0

expose_php=0
