# A pooled FastCGI connection was tried here and removed. Do not add it back
# without re-reading this.
#
# `fastcgi_keep_conn on` with an upstream `keepalive` pool does raise
# throughput: measured on the trivial route, 2188 rps without it against 2591
# with — about 18%. It buys that by starving part of the queue. PHP-FPM does
# not multiplex FastCGI, so a pool of N children serves N connections at a
# time; nginx then keeps reusing whichever connections are already hot and a
# growing set of the others is never picked at all.
#
# The distribution says it plainly. With the pool: p95 of 1.9ms and a maximum
# of 19s. Without it: p95 of 123ms and a maximum of 190ms. A 1.9ms p95 is not
# good news here — it is most requests being served instantly while the rest
# hang for the entire measurement window. On the Laravel pair the same setup
# produced 0.7% to 1.3% outright failures, and lowering the pool from 64 to 4
# connections did not help, because the size was never the problem.
#
# It also breaks the comparison. Six of the eight runtimes serve HTTP
# themselves and have no proxy that could do this for them, so the throughput
# it buys is an advantage granted to the FPM variants by a tuning choice
# rather than by their execution model — which is the one thing this lab
# exists to isolate.
server {
    listen 8080;
    server_name _;
    root /var/www/html/app/public;
    index index.php;

    access_log off;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass app-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }
}
