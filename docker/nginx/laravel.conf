# See docker/nginx/default.conf for why there is no FastCGI connection pool
# here. Measured on this deployment: with one, 0.7% to 1.3% of requests failed
# outright and the slowest ran 56s; without it, zero failures and a maximum of
# 719ms, at slightly higher throughput.
server {
    listen 8080;
    server_name _;
    root /var/www/html/laravel/public;
    index index.php;

    access_log off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app-laravel-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }
}
