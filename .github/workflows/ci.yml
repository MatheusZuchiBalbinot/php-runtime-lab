name: CI

# Guards the measurement apparatus, not the measurements themselves. Benchmarks
# are not run here: a shared CI runner has noisy neighbours and no fixed CPU
# budget, so any number it produced would describe the runner. What CI can do is
# make sure the thing that produces numbers is not broken.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both adapter analysis and Pint need these installed; the images build
      # their own copies from the same committed lock files.
      - name: Install dependencies for analysis
        run: |
          docker run --rm -v "$PWD:/work" -w /work/laravel composer:2 \
            install --no-interaction --no-scripts --no-progress
          docker run --rm -v "$PWD:/work" -w /work/docker/roadrunner composer:2 \
            install --no-interaction --no-scripts --no-progress

      - name: Shared library (level 8)
        run: |
          docker run --rm -v "$PWD:/app:ro" -w /app ghcr.io/phpstan/phpstan:latest \
            analyse --no-progress

      # The per-runtime adapters are the only code that differs between
      # runtimes, which makes them the place where a defect skews a comparison
      # without failing anything.
      - name: Runtime adapters
        run: |
          docker run --rm -v "$PWD:/app:ro" -w /app ghcr.io/phpstan/phpstan:latest \
            analyse -c phpstan-adapters.neon --no-progress

  formatting:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Laravel dependencies
        run: |
          docker run --rm -v "$PWD:/work" -w /work/laravel composer:2 \
            install --no-interaction --no-scripts --no-progress

      - name: Check formatting
        run: |
          docker run --rm -v "$PWD:/work" -w /work php:8.3-cli-alpine \
            php laravel/vendor/bin/pint --test

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the shared application's test suite
        run: docker compose --profile test run --rm test

  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A build failure is the most common way this project breaks, and every
      # one so far was silent until an image was actually built: a missing
      # Swoole build dependency, a lock resolved for the wrong PHP version, an
      # Octane extension that was never installed.
      - name: Build every runtime image
        run: docker compose --profile all build

  routes:
    name: Routes answer on every runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `--wait` is load-bearing, not decoration. `up -d` returns as soon as the
      # containers have been created, and for a persistent worker that is long
      # before it serves anything: Octane and FrankenPHP boot the application
      # first. Without it the check below raced the boot, curl hit a closed
      # port, and the job failed on whichever runtime was slowest to start
      # rather than on anything actually wrong with it.
      #
      # Every service in the profile declares a healthcheck, and for the two
      # FPM pairs it is an HTTP GET through nginx to the FPM pool behind it —
      # so a `--wait` that returns means each public surface has already
      # answered a request. The explicit timeout keeps a runtime that never
      # comes up from hanging the job until the runner's own limit.
      - name: Start every runtime
        run: |
          cp .env.example .env
          docker compose --profile all up -d --build --wait --wait-timeout 300

      # Verifies wiring, not performance: each runtime must answer every route
      # declared in routes.json, and answer 404 for anything else. This is what
      # catches an adapter that starts but never routes — FrankenPHP's worker
      # mode did exactly that, serving the classic entrypoint while looking
      # healthy.
      - name: Check every route on every runtime
        run: |
          set -eu

          # `|| true` because this step reports every broken route rather than
          # stopping at the first: curl exits non-zero when it cannot connect
          # at all, and under `set -e` that killed the step before it could
          # print which runtime and path were unreachable. The write-out is
          # still emitted on a failed connection, as 000.
          http_status() {
            curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$1" || true
          }

          # Read once, and tolerant of whitespace, so reformatting routes.json
          # cannot silently reduce this job to checking nothing — an empty
          # path list would pass every runtime.
          routePaths="$(grep -oE '"path"[[:space:]]*:[[:space:]]*"[^"]+"' routes.json |
            sed -E 's/.*"path"[[:space:]]*:[[:space:]]*"//; s/"$//')"

          if [ -z "$routePaths" ]; then
            echo "No routes found in routes.json — nothing would be checked."
            exit 1
          fi

          failed=0
          while IFS='=' read -r runtime service; do
            case "$runtime" in ''|\#*) continue ;; esac
            # Entries carry taxonomy fields after the service name.
            service="${service%%|*}"

            port="$(docker compose --profile all port "$service" 8080 | tail -1 | sed 's/.*://')"
            if [ -z "$port" ]; then
              echo "FAIL ${runtime} service ${service} published no host port for 8080"
              failed=1
              continue
            fi

            echo "--- ${runtime} (${service}) on port ${port}"
            for path in $routePaths; do
              status="$(http_status "http://localhost:${port}${path}")"
              if [ "$status" != "200" ]; then
                echo "FAIL ${runtime} ${path} -> ${status}"
                failed=1
              fi
            done
            status="$(http_status "http://localhost:${port}/does-not-exist")"
            if [ "$status" != "404" ]; then
              echo "FAIL ${runtime} unknown path -> ${status} (expected 404)"
              failed=1
            fi
          done < benchmarks/runtimes.conf
          exit "$failed"

      # A runtime that never came up leaves nothing behind but a status of 000,
      # which says only that nobody answered. Its logs say why, and they are
      # gone the moment the teardown below runs.
      - name: Runtime logs
        if: failure()
        run: docker compose --profile all logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose --profile all down
